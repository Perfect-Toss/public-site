name: Deploy to Development

# `main` deploys to the development Azure Static Web App — the continuously updated integration target.
# It also cuts the release: semantic-release bumps the version, updates CHANGELOG.md and tags vX.Y.Z,
# so the development app always shows the newest released version. Production then deploys a chosen
# tag (see `deploy-production.yml`), so merging to `main` never ships to production.
#
# ALL app configuration is environment-scoped and must exist on the `development` GitHub environment:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  = development Static Web App deployment token
#   VITE_API_BASE_URL               = development API URL
#   VITE_FIREBASE_*                 = development Firebase project config
# Keep nothing app-specific at repository level: a repository-level fallback would silently
# fill in another environment's values when an environment secret is missing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
    # semantic-release tags the commit, writes CHANGELOG.md and publishes the GitHub release.
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: deploy-development
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        environment:
            name: development
            url: ${{ steps.deploy.outputs.static_web_app_url }}
        env:
            # Environment
            VITE_ENVIRONMENT: development
            # Firebase Configuration
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
            # API Configuration
            VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # semantic-release needs the tags to work out the next version.
                  fetch-depth: 0
                  # It authenticates its own push with GITHUB_TOKEN instead of the checkout credentials.
                  persist-credentials: false
                  submodules: true
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Every config value is environment-scoped, so a missing secret fails loudly here instead of
            # silently deploying the other environment's Firebase project or API URL.
            - name: Verify environment configuration
              env:
                  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
              run: |
                  missing=""
                  for name in \
                    AZURE_STATIC_WEB_APPS_API_TOKEN \
                    VITE_API_BASE_URL \
                    VITE_FIREBASE_API_KEY \
                    VITE_FIREBASE_APP_ID \
                    VITE_FIREBASE_AUTH_DOMAIN \
                    VITE_FIREBASE_MESSAGING_SENDER_ID \
                    VITE_FIREBASE_PROJECT_ID \
                    VITE_FIREBASE_STORAGE_BUCKET; do
                    value=$(printenv "$name" || true)
                    if [ -z "$value" ]; then
                      missing="${missing:+$missing, }$name"
                    fi
                  done
                  if [ -n "$missing" ]; then
                    echo "::error::Missing environment secret(s) on 'development': $missing"
                    echo "Add them under Settings -> Environments -> development, using the development values."
                    exit 1
                  fi
                  echo "Environment configuration for 'development' is present."

            # Cut the release before building, so the development app shows the version it just
            # produced and production can deploy that tag. Skipped when a manual run is started from
            # a branch other than main.
            - name: Release
              if: github.ref_name == 'main'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            # Read AFTER the release: HEAD is the release commit and package.json holds the new version.
            - name: Resolve build metadata
              id: buildmeta
              run: |
                  printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  printf 'version=%s\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

            # `npm run build` already runs lint + tsc, so no separate lint step is needed.
            - name: Build application
              env:
                  VITE_GIT_SHA: ${{ steps.buildmeta.outputs.sha }}
              run: npm run build

            - name: Deploy to Azure Static Web Apps
              id: deploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "dist" # Upload only the built dist folder
                  api_location: "" # Leave empty if no API
                  output_location: "" # Empty because we're already pointing to dist
                  skip_app_build: true # We already built it
                  skip_api_build: true

            - name: Deployment summary
              env:
                  URL: ${{ steps.deploy.outputs.static_web_app_url }}
                  SHA: ${{ steps.buildmeta.outputs.sha }}
                  VERSION: ${{ steps.buildmeta.outputs.version }}
              run: |
                  {
                    echo "### Deployed to development"
                    echo ""
                    echo "- URL: $URL"
                    echo "- Commit: \`${SHA:0:7}\`"
                    echo "- Version: \`v$VERSION\`"
                  } >> "$GITHUB_STEP_SUMMARY"
