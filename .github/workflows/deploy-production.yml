name: Deploy to Production

# Deploys a released version to the production Azure Static Web App. Nothing here is released or
# tagged: `deploy-development.yml` cuts the release on every push to main, and this workflow just
# ships one of those tags. So production can lag behind main, and redeploying or rolling back is a
# matter of picking a different version.
#
# ALL app configuration is environment-scoped and must exist on the `production` GitHub environment:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  = production Static Web App deployment token
#   VITE_API_BASE_URL               = production API URL
#   VITE_FIREBASE_*                 = production Firebase project config
# Keep nothing app-specific at repository level: a repository-level fallback would silently
# fill in another environment's values when an environment secret is missing.
# Add required reviewers / deployment branches (main only) to gate releases.

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version to deploy, e.g. 1.2.3 or v1.2.3. Blank = latest release tag."
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy release
        runs-on: ubuntu-latest
        environment:
            name: production
            url: ${{ steps.deploy.outputs.static_web_app_url }}
        env:
            # Environment
            VITE_ENVIRONMENT: production
            # Firebase Configuration
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
            # API Configuration
            VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # Full history so every release tag is available to choose from.
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
                  submodules: true
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            # Resolves the requested version (or the latest tag) and checks that commit out, so every
            # later step — npm ci, the build, version.json — runs against exactly that release.
            - name: Resolve version to deploy
              id: resolve
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  version="${INPUT_VERSION:-}"
                  if [ -z "$version" ]; then
                    if ! tag="$(git describe --tags --abbrev=0 2>/dev/null)"; then
                      echo "::error::No release tags exist yet. Merge a fix:/feat: commit to main first."
                      exit 1
                    fi
                  else
                    tag="v${version#v}"
                  fi
                  if ! git rev-parse --verify --quiet "$tag^{commit}" > /dev/null; then
                    echo "::error::'$tag' is not a known tag."
                    echo "Recent tags:"
                    git tag --list 'v*' --sort=-v:refname | head -n 10
                    exit 1
                  fi
                  git checkout --detach "$tag"
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                    echo "::error::'$tag' is not on main; only released commits on main can go to production."
                    exit 1
                  fi
                  printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
                  printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  printf 'version=%s\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
                  echo "Deploying $tag ($(git rev-parse --short HEAD))"

            - name: Install dependencies
              run: npm ci

            # Every config value is environment-scoped, so a missing secret fails loudly here instead of
            # silently deploying the other environment's Firebase project or API URL.
            - name: Verify environment configuration
              env:
                  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
              run: |
                  missing=""
                  for name in \
                    AZURE_STATIC_WEB_APPS_API_TOKEN \
                    VITE_API_BASE_URL \
                    VITE_FIREBASE_API_KEY \
                    VITE_FIREBASE_APP_ID \
                    VITE_FIREBASE_AUTH_DOMAIN \
                    VITE_FIREBASE_MESSAGING_SENDER_ID \
                    VITE_FIREBASE_PROJECT_ID \
                    VITE_FIREBASE_STORAGE_BUCKET; do
                    value=$(printenv "$name" || true)
                    if [ -z "$value" ]; then
                      missing="${missing:+$missing, }$name"
                    fi
                  done
                  if [ -n "$missing" ]; then
                    echo "::error::Missing environment secret(s) on 'production': $missing"
                    echo "Add them under Settings -> Environments -> production, using the production values."
                    exit 1
                  fi
                  echo "Environment configuration for 'production' is present."

            # `npm run build` already runs lint + tsc, so no separate lint step is needed.
            - name: Build application
              env:
                  VITE_GIT_SHA: ${{ steps.resolve.outputs.sha }}
              run: npm run build

            - name: Deploy to Azure Static Web Apps
              id: deploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "dist" # Upload only the built dist folder
                  api_location: "" # Leave empty if no API
                  output_location: "" # Empty because we're already pointing to dist
                  skip_app_build: true # We already built it
                  skip_api_build: true

            - name: Deployment summary
              env:
                  URL: ${{ steps.deploy.outputs.static_web_app_url }}
                  TAG: ${{ steps.resolve.outputs.tag }}
                  SHA: ${{ steps.resolve.outputs.sha }}
                  VERSION: ${{ steps.resolve.outputs.version }}
              run: |
                  {
                    echo "### Deployed $TAG to production"
                    echo ""
                    echo "- URL: $URL"
                    echo "- Version: \`v$VERSION\`"
                    echo "- Commit: \`${SHA:0:7}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
