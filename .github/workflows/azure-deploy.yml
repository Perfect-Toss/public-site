name: Build and Deploy to Azure

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        types: [opened, synchronize, reopened, closed]
        branches:
            - main
            - dev
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy to"
                required: true
                type: choice
                options:
                    - production
                    - development

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build and Validate
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: true
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint code
              run: npm run lint

            - name: Build application
              run: npm run build
              env:
                  NODE_ENV: production
                  # Firebase Configuration
                  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
                  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
                  # API Configuration
                  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
                  # Environment
                  VITE_ENVIRONMENT: production

    build_and_deploy:
        name: Build and Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
            url: ${{ steps.deploy.outputs.static_web_app_url }}
        steps:
            - name: Set environment variables
              id: set-env
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ inputs.environment }}" == "production" ]]; then
                    echo "ENVIRONMENT=production" >> $GITHUB_ENV
                    echo "DEPLOY_ENV=Production" >> $GITHUB_ENV
                  else
                    echo "ENVIRONMENT=development" >> $GITHUB_ENV
                    echo "DEPLOY_ENV=Development" >> $GITHUB_ENV
                  fi

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: true
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint code
              run: npm run lint
              continue-on-error: true

            - name: Build application
              run: npm run build
              env:
                  NODE_ENV: ${{ env.ENVIRONMENT }}
                  # Firebase Configuration
                  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
                  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
                  # API Configuration
                  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
                  # Environment
                  VITE_ENVIRONMENT: ${{ env.ENVIRONMENT }}

            - name: Deploy to Azure Static Web Apps
              id: deploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "/" # Location of your application code
                  api_location: "" # Leave empty if no API
                  output_location: "dist" # Built app content directory - Vite default
                  skip_app_build: true # We already built it
