name: Build and Deploy to Azure

# Deployments:
#   push to main  -> production  (production Static Web App)
#   push to dev   -> development (development Static Web App)
#   manual run    -> whichever environment is selected
# Pull requests only build/validate; they never deploy.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: development
        options:
          - development
          - production

permissions:
  contents: read
  pull-requests: write

# One deployment per environment at a time; never cancel a deploy that is already running.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - name: Resolve environment
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            # PRs are validation only; the push that merges them handles deployment.
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "environment=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "environment=$INPUT_ENV" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "environment=development" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Branch '$BRANCH' has no deployment target."
            exit 1
          fi

  build:
    name: Build and Validate
    needs: target
    if: needs.target.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm run build` already runs lint + tsc, so a separate lint step is redundant.
      - name: Build application
        run: npm run build
        env:
          # Firebase Configuration
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # API Configuration
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Environment: validate PRs against the config of the branch they target
          VITE_ENVIRONMENT: ${{ github.base_ref == 'main' && 'production' || 'development' }}
          VITE_GIT_SHA: ${{ github.sha }}

  deploy:
    name: Deploy to ${{ needs.target.outputs.environment }}
    needs: target
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Selecting a GitHub environment here makes its environment secrets win over
    # repository secrets, so each app gets its own AZURE_STATIC_WEB_APPS_API_TOKEN.
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No AZURE_STATIC_WEB_APPS_API_TOKEN for the '$ENVIRONMENT' environment. Add the deployment token of the '$ENVIRONMENT' Azure Static Web App as an environment secret."
            exit 1
          fi

      # `npm run build` already runs lint + tsc, so a separate lint step is redundant.
      - name: Build application
        run: npm run build
        env:
          # Firebase Configuration
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # API Configuration
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Environment
          VITE_ENVIRONMENT: ${{ needs.target.outputs.environment }}
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist" # Upload only the built dist folder
          api_location: "" # Leave empty if no API
          output_location: "" # Empty because we're already pointing to dist
          skip_app_build: true # We already built it
          skip_api_build: true

      - name: Deployment summary
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "### Deployed to $ENVIRONMENT"
            echo ""
            echo "- URL: $URL"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
